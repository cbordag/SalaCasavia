<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala Casavia | Tarifas y Equipamiento</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

  <main class="max-w-4xl mx-auto px-6 py-12">
    <header class="mb-12 border-b border-zinc-800 pb-8">
      <span id="estado-badge" class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full mb-4">
        Cargando estado...
      </span>
      <h1 class="text-4xl font-bold tracking-tight text-white">Sala Casavia</h1>
      <p class="text-zinc-400 mt-2 text-lg">
        Espacio acondicionado acústicamente, monitoreo 100% cableado por audífonos y grabación multipista de 16 canales incluida.
      </p>
    </header>

    <div id="error-box" class="hidden mb-8 p-4 rounded-xl bg-red-950/50 border border-red-800 text-red-200 text-sm"></div>

    <section class="mb-14">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-6">
        <h2 class="text-2xl font-semibold text-white">Bloques y Tarifas</h2>
        <p id="nota-montaje" class="text-sm text-zinc-400 mt-1 sm:mt-0"></p>
      </div>
      <div id="grid-tarifas" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
    </section>

    <section>
      <h2 class="text-2xl font-semibold text-white mb-6">Equipamiento e Infraestructura</h2>
      <div id="grid-equipamiento" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxKsL6XsBaeEAKQS-5O51su9bfsT5AT_qxb3cELO2DrGh-5ZA1iR7oP3WAbf9VKECnM/exec';

    const formatoCLP = (valor) => new Intl.NumberFormat('es-CL', {
      style: 'currency',
      currency: 'CLP',
      maximumFractionDigits: 0
    }).format(valor);

    const formatearHora = (valor) => {
      if (!valor) return '';
      const str = String(valor);
      // Si ya viene como texto limpio "10:00", lo devuelve directo
      if (/^\d{1,2}:\d{2}$/.test(str.trim())) return str.trim();
      // Si viene como fecha ISO de Google Sheets (1899-12-30T...), extrae HH:MM en hora de Santiago
      const fecha = new Date(str);
      if (!isNaN(fecha.getTime())) {
        return fecha.toLocaleTimeString('es-CL', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
          timeZone: 'America/Santiago'
        });
      }
      return str;
    };

    async function cargarDatos() {
      const errorBox = document.getElementById('error-box');
      try {
        const res = await fetch(API_URL, { redirect: 'follow' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error('La URL no devolvió JSON válido. Revisa que el acceso en Apps Script esté configurado como "Cualquier persona".');
        }

        document.getElementById('estado-badge').textContent = data.reglas.estado_sala || 'Disponible';
        document.getElementById('nota-montaje').textContent = 
          `* Incluye ${data.reglas.tiempo_montaje_min} min iniciales para montaje y seteo.`;

        const gridTarifas = document.getElementById('grid-tarifas');
        gridTarifas.innerHTML = data.tarifas.map(t => `
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 flex flex-col justify-between">
            <div>
              <span class="text-xs font-medium uppercase tracking-wider text-emerald-400">Bloque ${t.Duracion_Horas} hrs</span>
              <h3 class="text-xl font-semibold text-white mt-1">${t.Bloque}</h3>
              <p class="text-zinc-300 text-base font-medium mt-3">
                ${formatearHora(t.Hora_Inicio)} a ${formatearHora(t.Hora_Fin)} hrs
              </p>
            </div>
            <div class="mt-6 pt-4 border-t border-zinc-800">
              <span class="text-3xl font-bold text-white">${formatoCLP(t.Precio_CLP)}</span>
            </div>
          </div>
        `).join('');

        const gridEquip = document.getElementById('grid-equipamiento');
        gridEquip.innerHTML = data.equipamiento.map(eq => `
          <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-xl p-5">
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">${eq.Categoria}</span>
            <h3 class="text-lg font-semibold text-white mt-1">${eq.Titulo}</h3>
            <p class="text-zinc-300 text-sm mt-2 leading-relaxed">${eq.Descripcion}</p>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('estado-badge').textContent = 'Error de conexión';
        errorBox.classList.remove('hidden');
        errorBox.innerHTML = `<strong>Detalle del error:</strong> ${err.message}`;
        console.error(err);
      }
    }

    cargarDatos();
  </script>
</body>
</html>
